[screen_filters]
; For screen filters, we use the GPU's color correction lookup
; tables (one LUT for each color component).
; These LUTs replace each color intensity by the corresponding
; value in the LUT (0 to 255).
; The following formula is used:
;   y_c = (contrast_c * whitepoint_c(cct) * x_c) ^ gamma_c
; where:
;   * x_c = intensity_c / 255
;   * output is multiplied by 255, rounded, and clamped
;   * color curve adjustment (if any), then color inversion (if
; enabled), are then applied to the output

; Note: the color curve adjustment settings ("enhance top/bottom screen
; colors") have been moved to MCU storage, and are no longer configured
; here. Use the Rosalina menu to change them.

; Correlated Color Temperature (CCT) for the screen filters
; (1000 to 25100).
screen_filters_top_cct = %d
screen_filters_bot_cct = %d

; Per-channel (red, green, blue) gamma adjustment for the screen
; filters (0 to 4).
; Increasing this above 1 will make colors look more saturated.
screen_filters_top_gamma_r = %s
screen_filters_top_gamma_g = %s
screen_filters_top_gamma_b = %s
screen_filters_bot_gamma_r = %s
screen_filters_bot_gamma_g = %s
screen_filters_bot_gamma_b = %s

; Per-channel (red, green, blue) contrast adjustment for the screen
; filters (0 to 8). For contrast > 1, results are clamped as necessary.
screen_filters_top_contrast_r = %s
screen_filters_top_contrast_g = %s
screen_filters_top_contrast_b = %s
screen_filters_bot_contrast_r = %s
screen_filters_bot_contrast_g = %s
screen_filters_bot_contrast_b = %s

; Whether or not the screen filters should invert colors.
screen_filters_top_invert = %d
screen_filters_bot_invert = %d

[autoboot]
; Autoboot options

; DSi title ID of the application to use when autobooting
; into DSi mode. The title must be installed on NAND.
autoboot_dsi_titleid = %016llx

; Memory layout to use when autobooting into 3DS homebrew:
; - 0: Normal memory layout (64 MB of application memory on O3DS,
; 124 MB on N3DS)
; - 1: Dev1 memory layout (96 MB / 178 MB)
; - 2: Dev2 memory layout (80 MB / 124 MB)
; - 3: Dev3 memory layout (72 MB / 124 MB)
; - 4: Dev4 memory layout (32 MB / 124 MB)
autoboot_3ds_app_mem_type = %d

; If enabled (= 1), NS will directly launch the 3DS homebrew
; title when autobooting, without starting HOME Menu first.
; Otherwise, HOME Menu is started and then launches the title.
; Please note that using anything other than the normal memory
; layout with this option enabled will cause HOME Menu to crash
; if it launched (usually via the HOME button or the POWER
; button - just use the poweroff/reboot option from Rosalina
; menu instead).
; Furthermore, if this option is enabled, the title must exist,
; or a fatal error will occur.
autoboot_3ds_use_ns = %d

